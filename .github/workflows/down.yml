name: Download and Commit File

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct DLL URLs separated by spaces (optional)'
        required: false
        default: ''
        type: string
      move_existing_files:
        description: 'Move files, update commit messages, and generate release redirects'
        required: false
        default: false
        type: boolean
      name:
        description: 'Optional mod names, separate batch values with | and leave blanks to auto-detect'
        type: string
      guid:
        description: 'Stable GUIDs for DLLs without one, separate batch values with |'
        type: string
      version:
        description: 'Optional mod versions, separate batch values with | and leave blanks to auto-detect'
        type: string

permissions:
  contents: write

concurrency:
  # Releases are shared by every branch in the repository
  group: download-and-commit
  queue: max
  cancel-in-progress: false

jobs:
  download-and-commit:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          ref: ${{ github.ref }}

      - name: Publish DLLs, reorganize files, and update README
        shell: bash
        env:
          DOWNLOAD_URL: ${{ inputs.url }}
          MOVE_EXISTING_FILES: ${{ inputs.move_existing_files }}
          MOD_NAME: ${{ inputs.name }}
          MOD_GUID: ${{ inputs.guid }}
          MOD_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Split on whitespace without expanding shell metacharacters in URLs
          DOWNLOAD_URL="${DOWNLOAD_URL:-}"
          DOWNLOAD_URL="${DOWNLOAD_URL//$'\r'/ }"
          IFS=$' \t' read -r -a DOWNLOAD_URLS <<< "${DOWNLOAD_URL//$'\n'/ }"
          DOWNLOAD_COUNT=${#DOWNLOAD_URLS[@]}
          MOVE_EXISTING_FILES="${MOVE_EXISTING_FILES:-false}"
          EVENT_NAME="${EVENT_NAME:-workflow_dispatch}"
          if [[ "$DOWNLOAD_COUNT" -eq 0 && "$MOVE_EXISTING_FILES" != true && "$EVENT_NAME" != push ]]; then
            echo "No URL provided and moving existing files is disabled, nothing to do"
            exit 0
          fi

          TIMESTAMP=$(TZ=UTC date +"%Y-%m-%d_%H-%M-%S")
          TEMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/repo-download.XXXXXX")
          trap 'rm -rf -- "$TEMP_DIR"' EXIT

          # Shared metadata and listing helpers stay outside the repository
          cat > "$TEMP_DIR/metadata.py" <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          from decimal import Decimal, localcontext
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, quote_from_bytes, urlencode
          from urllib.request import Request, urlopen

          BASE_URL = "https://andres9890.github.io/files/"
          UNITS = ("B", "KB", "MB", "GB", "TB", "PB", "EB")
          NO_DOWNLOAD = "N/A (no download requested)"
          GUID_PATTERN = r"[A-Za-z0-9][A-Za-z0-9._-]*"
          VERSION_PATTERN = r"[A-Za-z0-9][A-Za-z0-9.+_-]*"
          MOD_FILENAME = re.compile(
              rf".+-\((?P<guid>{GUID_PATTERN})\)-{VERSION_PATTERN}\.dll"
          )
          INDEX_START = "<!-- BEGIN GENERATED FILE DOWNLOADS -->"
          INDEX_END = "<!-- END GENERATED FILE DOWNLOADS -->"


          def format_size(byte_count):
              byte_count = int(byte_count)
              if byte_count < 1024:
                  return f"{byte_count} bytes"
              with localcontext() as context:
                  context.prec = 100
                  value = Decimal(byte_count)
                  unit = 0
                  while value >= 1024 and unit < len(UNITS) - 1:
                      value /= 1024
                      unit += 1
                  number = format(value, ".2f")
                  if "." in number:
                      number = number.rstrip("0").rstrip(".")
              return f"{number} {UNITS[unit]} ({byte_count} bytes)"


          def current_url(filename):
              return BASE_URL + quote(filename, safe="")


          def repository_path():
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              if not re.fullmatch(r"[^/]+/[^/]+", repository):
                  raise RuntimeError("GITHUB_REPOSITORY must contain owner/repo")
              return f"/repos/{repository}"


          def github_request(
              endpoint, *, method="GET", payload=None, upload=None, download_digest=False
          ):
              api_url = os.environ.get(
                  "GITHUB_API_URL", "https://api.github.com"
              ).rstrip("/")
              url = api_url + endpoint if endpoint.startswith("/") else endpoint
              if not url.startswith("https://"):
                  raise RuntimeError("GitHub API URLs must use HTTPS")
              headers = {
                  "Accept": (
                      "application/octet-stream" if download_digest
                      else "application/vnd.github+json"
                  ),
                  "User-Agent": "download-and-commit-workflow",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              data = None
              if upload is not None:
                  headers["Content-Type"] = "application/octet-stream"
                  headers["Content-Length"] = str(os.fstat(upload.fileno()).st_size)
                  data = upload
              elif payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              request = Request(url, data=data, headers=headers, method=method)
              token = os.environ.get("GITHUB_TOKEN", "")
              if token:
                  request.add_unredirected_header("Authorization", f"Bearer {token}")
              with urlopen(request, timeout=180 if upload is not None else 30) as response:
                  if download_digest:
                      return "sha256:" + hashlib.file_digest(response, "sha256").hexdigest()
                  return None if response.status == 204 else json.load(response)


          def github_items(endpoint):
              page = 1
              while True:
                  items = github_request(f"{endpoint}?per_page=100&page={page}")
                  if not isinstance(items, list):
                      raise RuntimeError(
                          f"GitHub returned an unexpected response for {endpoint}"
                      )
                  yield from items
                  if len(items) < 100:
                      break
                  page += 1


          def batch_overrides(count):
              columns = []
              for field in ("name", "guid", "version"):
                  value = os.environ.get(f"MOD_{field.upper()}", "").strip()
                  if count > 1 and value:
                      values = value.split("|")
                  else:
                      values = [value] * count
                  if len(values) != count:
                      raise SystemExit(
                          f"Enter {count} pipe-separated {field} values, one per URL, "
                          "and leave a position blank to read it from the DLL"
                      )
                  columns.append(values)
              for overrides in zip(*columns):
                  for value in overrides:
                      sys.stdout.buffer.write(value.strip().encode("utf-8") + b"\0")


          def read_dll_fields(metadata_path):
              metadata = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
              name, guid, version = (
                  (os.environ.get(f"MOD_{field.upper()}", "").strip()
                   or (metadata.get(field) or "").strip())
                  for field in ("name", "guid", "version")
              )
              if not all((name, guid, version)):
                  raise SystemExit(
                      "The DLL is missing a mod name, GUID, or version, "
                      "supply the missing value in the workflow inputs"
                  )
              if name.startswith(".") or re.search(r'[<>:"/\\|?*\x00-\x1f\x7f]', name):
                  raise SystemExit("The mod name contains an unsafe filename character")
              if not re.fullmatch(GUID_PATTERN, guid) or subprocess.run(
                  ["git", "check-ref-format", f"refs/tags/{guid}"]
              ).returncode:
                  raise SystemExit("The mod GUID must be a valid Git tag and filename component")
              if not re.fullmatch(VERSION_PATTERN, version):
                  raise SystemExit("The mod version must be safe to use in a filename")
              filename = f"{name}-({guid})-{version}.dll"
              if len(filename.encode("utf-8")) > 250:
                  raise SystemExit("The renamed DLL filename is too long")
              print(filename, guid, f"{name} {version}", sep="\n")


          def mod_guid(filename):
              match = MOD_FILENAME.fullmatch(filename or "")
              return match["guid"] if match else None


          def find_release(releases_path, guid):
              try:
                  return github_request(f"{releases_path}/tags/{quote(guid, safe='')}")
              except HTTPError as error:
                  if error.code != 404:
                      raise
              # The by-tag endpoint can miss a draft left by an interrupted run
              return next(
                  (release for release in github_items(releases_path)
                   if release["tag_name"] == guid),
                  None,
              )


          def publish_dll(path, guid, title, sha256):
              path = Path(path)
              filename = path.name
              releases_path = f"{repository_path()}/releases"
              release = find_release(releases_path, guid)
              if release is None:
                  target = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True)
                  release = github_request(releases_path, method="POST", payload={
                      "tag_name": guid,
                      "target_commitish": target.strip(),
                      "name": title,
                      "draft": True,
                  })

              release_path = f"{releases_path}/{release['id']}"
              assets = list(github_items(f"{release_path}/assets"))
              asset = next(
                  (item for item in assets if item["state"] == "uploaded"
                   and filename in (item.get("name"), item.get("label"))),
                  None,
              )
              added = asset is None
              if added:
                  if release.get("immutable"):
                      raise SystemExit(f"Release {guid} is immutable and cannot accept new assets")
                  # A failed GitHub upload can leave a zero-byte starter asset
                  for item in assets:
                      if item["state"] == "starter" and filename in (
                          item.get("name"), item.get("label")
                      ):
                          github_request(
                              f"{releases_path}/assets/{item['id']}", method="DELETE"
                          )
                  query = urlencode({"name": filename, "label": filename})
                  upload_url = release["upload_url"].split("{", 1)[0]
                  with path.open("rb") as handle:
                      asset = github_request(f"{upload_url}?{query}", method="POST", upload=handle)
              else:
                  digest = asset.get("digest") or github_request(
                      f"{releases_path}/assets/{asset['id']}", download_digest=True
                  )
                  if digest != f"sha256:{sha256}":
                      raise SystemExit(
                          f"Release asset {filename!r} already exists with different "
                          "contents, use a new version"
                      )

              # The upload endpoint can normalize spaces and punctuation
              # Try to restore the stored name and keep the exact display label
              if asset["name"] != filename and not release.get("immutable"):
                  try:
                      asset = github_request(
                          f"{releases_path}/assets/{asset['id']}", method="PATCH",
                          payload={"name": filename, "label": filename},
                      )
                  except HTTPError as error:
                      if error.code not in (400, 403, 409, 422):
                          raise
                  if asset["name"] != filename:
                      print(f"GitHub stores the asset as {asset['name']!r} (label {filename!r})")

              # Retry interrupted updates and keep the newest uploaded version in the title
              uploaded_mods = [
                  item for item in assets if item["state"] == "uploaded"
                  and guid in (mod_guid(item.get("name")), mod_guid(item.get("label")))
              ]
              latest = max(
                  uploaded_mods,
                  key=lambda item: (item.get("created_at") or "", item["id"]),
                  default=asset,
              )
              if release.get("draft") or added or asset["id"] == latest["id"]:
                  if release.get("draft") or release["name"] != title:
                      release = github_request(release_path, method="PATCH", payload={
                          "name": title,
                          "draft": False,
                      })
              print(f"Release: {release['html_url']}")


          def release_redirect_html(url):
              attribute_url = html.escape(url, quote=True)
              script_url = json.dumps(url, ensure_ascii=True).replace(
                  "<", "\\u003c"
              ).replace(">", "\\u003e").replace("&", "\\u0026")
              return (
                  '<!DOCTYPE html>\n<html>\n<head>\n'
                  f'<meta http-equiv="refresh" content="0;url={attribute_url}">\n'
                  f'<script>window.location.replace({script_url});</script>\n'
                  '</head>\n<body></body>\n</html>\n'
              )


          def published_assets(tags=None):
              # The redirect and index steps share one release snapshot per run
              cache = Path(__file__).with_name("release-assets.json")
              if cache.is_file():
                  return json.loads(cache.read_text(encoding="utf-8"))
              releases_path = f"{repository_path()}/releases"
              releases = sorted(
                  (
                      release for release in github_items(releases_path)
                      if not release.get("draft", False)
                      and (tags is None or release["tag_name"] in tags)
                  ),
                  key=lambda release: (
                      release.get("published_at")
                      or release.get("created_at", ""),
                      release["id"],
                  ),
                  reverse=True,
              )
              assets = []
              for release in releases:
                  # This endpoint lists uploaded assets, including ZIP and tar.gz,
                  # and skips GitHub's generated source archives
                  for asset in github_items(
                      f"{releases_path}/{release['id']}/assets"
                  ):
                      if asset.get("state") != "uploaded":
                          continue
                      name = asset.get("name", "")
                      url = asset.get("browser_download_url", "")
                      if (
                          not name or name in (".", "..")
                          or "/" in name or "\\" in name or "\0" in name
                      ):
                          raise RuntimeError(f"Invalid release filename: {name!r}")
                      if not url.startswith("https://"):
                          raise RuntimeError(f"Invalid download URL for {name!r}")
                      assets.append((release["tag_name"], name, asset.get("label"), url))
              cache.write_text(json.dumps(assets), encoding="utf-8")
              return assets


          def generate_release_redirects():
              selected = {}
              for _, name, _, url in published_assets():
                  # A shared filename points to its newest published release
                  selected.setdefault(name, url)

              changes = []
              for name, url in sorted(
                  selected.items(), key=lambda item: (item[0].casefold(), item[0])
              ):
                  target = Path(name + ".html")
                  content = release_redirect_html(url)
                  if target.is_symlink() or (
                      target.exists() and not target.is_file()
                  ):
                      raise RuntimeError(f"Cannot replace non-file: {target}")
                  if target.exists():
                      existing = target.read_text(encoding="utf-8")
                      if existing == content:
                          continue
                      # Refresh minimal redirect pages and preserve unrelated HTML documents
                      if not re.fullmatch(
                          r'\s*<!DOCTYPE html>\s*<html>\s*<head>\s*'
                          r'<meta\b[^>]*http-equiv=["\x27]refresh["\x27][^>]*>\s*'
                          r'<script>\s*window\.location\.replace\(.*?\);\s*</script>\s*'
                          r'</head>\s*<body>\s*</body>\s*</html>\s*',
                          existing, flags=re.IGNORECASE | re.DOTALL,
                      ):
                          raise RuntimeError(
                              f"Refusing to overwrite unrelated HTML: {target}"
                          )
                  changes.append((target, content))

              for target, content in changes:
                  target.write_text(content, encoding="utf-8")
                  subprocess.run(["git", "add", "-f", "--", str(target)], check=True)
              print(
                  f"Checked {len(selected)} release files, "
                  f"created or updated {len(changes)} HTML redirects"
              )


          def field(text, name):
              match = re.search(
                  rf"(?m)^-[ \t]*{re.escape(name)}:[ \t]*(.*)$", text
              )
              return match.group(1).strip() if match else ""


          def update_old_logs():
              root_files = sorted(
                  (
                      path for path in Path(".").iterdir()
                      if path.is_file() and not path.is_symlink()
                  ),
                  key=lambda path: path.name,
              )
              by_name = {path.name: path for path in root_files}
              hash_cache = {}
              updated_count = 0

              def digest(path, algorithm):
                  key = (path, algorithm)
                  if key not in hash_cache:
                      hasher = hashlib.new(algorithm)
                      with path.open("rb") as handle:
                          for chunk in iter(
                              lambda: handle.read(1024 * 1024), b""
                          ):
                              hasher.update(chunk)
                      hash_cache[key] = hasher.hexdigest()
                  return hash_cache[key]

              def find_current_file(filename, text):
                  expected = field(text, "SHA256").lower()
                  algorithm = "sha256"
                  if not expected:
                      expected = field(text, "MD5").lower()
                      algorithm = "md5"
                  named_file = by_name.get(filename)
                  if not expected:
                      return named_file
                  candidates = []
                  if named_file is not None:
                      candidates.append(named_file)
                  candidates.extend(
                      path for path in root_files if path != named_file
                  )
                  for candidate in candidates:
                      if digest(candidate, algorithm) == expected:
                          return candidate
                  return None

              for log in sorted(Path("workflow").rglob("commit_msg_*.txt")):
                  if not log.is_file() or log.is_symlink():
                      continue
                  try:
                      original = log.read_text(encoding="utf-8")
                  except UnicodeError:
                      print(f"Skipping non-UTF-8 log: {log}")
                      continue
                  text = original
                  filename = field(text, "File")
                  if not filename:
                      first_line = text.splitlines()[0] if text else ""
                      match = re.fullmatch(
                          r'Add downloaded file "(.*)"'
                          r'(?: and flatten existing folders)?', first_line
                      )
                      if match:
                          filename = match.group(1)

                  url = NO_DOWNLOAD
                  if filename:
                      actual = find_current_file(filename, text)
                      byte_count = None
                      if actual is not None:
                          filename = actual.name
                          byte_count = actual.stat().st_size
                          text = re.sub(
                              r"(?m)^- File:.*$",
                              lambda _: f"- File: {filename}", text, count=1
                          )
                      else:
                          match = re.search(
                              r"\(([\d,]+) bytes\)", field(text, "Size")
                          )
                          if not match:
                              match = re.fullmatch(
                                  r"([\d,]+)[ \t]*(?:bytes|B)",
                                  field(text, "Size"),
                              )
                          if match:
                              byte_count = int(match.group(1).replace(",", ""))
                      if byte_count is not None:
                          size_line = f"- Size: {format_size(byte_count)}"
                          if re.search(r"(?m)^- Size:", text):
                              text = re.sub(
                                  r"(?m)^- Size:.*$", lambda _: size_line,
                                  text, count=1
                              )
                          else:
                              text = text.rstrip("\n") + "\n" + size_line + "\n"
                      else:
                          print(
                              f"Could not recover exact size for {log}; "
                              "keeping its existing size"
                          )
                      url = current_url(filename)

                  lines = [
                      line for line in text.splitlines()
                      if not re.match(
                          r"(?i)^(?:-[ \t]*)?Current URL:", line
                      )
                  ]
                  while lines and not lines[-1].strip():
                      lines.pop()
                  lines.append(f"- Current URL: {url}")
                  updated = "\n".join(lines) + "\n"
                  if updated != original:
                      log.write_text(updated, encoding="utf-8")
                      updated_count += 1
              print(f"Updated {updated_count} previous commit-message files")


          def remove_legacy_indexes():
              for filename in ("list.txt", "liste.txt"):
                  legacy = Path(filename)
                  if not legacy.is_file() or legacy.is_symlink():
                      continue
                  try:
                      lines = legacy.read_text(encoding="utf-8").splitlines()
                  except UnicodeError:
                      continue
                  if BASE_URL + filename in lines and all(
                      line.startswith(BASE_URL) for line in lines
                  ):
                      legacy.unlink()
                      print(f"Migrating the generated {filename} index to README.md")


          def markdown_text(value):
              value = re.sub(r"[\x00-\x1f\x7f]", " ", value)
              return re.sub(r"([\\|\[\]*_~`])", r"\\\1", html.escape(value))


          def download_link(label, url):
              url = quote(url, safe=":/?#[]@!$&'()*+,;=%~-._")
              return f"[{label}](<{url}>)"


          def build_file_list():
              # The staged Git index contains all files that will be committed,
              # including nested files, and excludes internal .git metadata
              paths = set(subprocess.check_output(
                  ["git", "ls-files", "--cached", "-z"]
              ).split(b"\0"))
              paths.difference_update((b"", b"README.md"))
              mods, other = [], []
              for path in sorted(paths, key=lambda path: (
                  path.decode("utf-8", "surrogateescape").casefold(), path,
              )):
                  filename = path.rsplit(b"/", 1)[-1].decode("utf-8", "replace")
                  display = markdown_text(path.decode("utf-8", "replace"))
                  site_url = BASE_URL + quote_from_bytes(path, safe="/")
                  guid = mod_guid(filename)
                  if guid:
                      mods.append((guid, filename, display, site_url))
                  else:
                      other.append(f"- {download_link(display, site_url)}")

              lines = [INDEX_START, "", "## File downloads", "", "### Mods", ""]
              if mods:
                  release_urls = {}
                  for tag, name, label, url in published_assets({mod[0] for mod in mods}):
                      for filename in (name, label):
                          if mod_guid(filename) == tag:
                              release_urls.setdefault((tag, filename), url)
                  lines.extend((
                      "| Mod file | Site | Release |",
                      "| --- | --- | --- |",
                  ))
                  for guid, filename, display, site_url in mods:
                      release_url = release_urls.get((guid, filename))
                      site = download_link("Download from site", site_url)
                      release = (
                          download_link("Download from release", release_url)
                          if release_url else "—"
                      )
                      lines.append(f"| {display} | {site} | {release} |")
              else:
                  lines.append("No mods have been published yet")
              if other:
                  lines.extend(("", "### Other files", "", *other))
              lines.extend(("", INDEX_END))
              section = "\n".join(lines)

              target = Path("README.md")
              if target.is_symlink() or (
                  target.exists() and not target.is_file()
              ):
                  raise SystemExit("README.md must be a regular file")
              original = target.read_text(encoding="utf-8") if target.exists() else ""
              if INDEX_START in original or INDEX_END in original:
                  start = original.find(INDEX_START)
                  end = original.find(INDEX_END)
                  if not (
                      0 <= start < end and original.count(INDEX_START) == 1
                      and original.count(INDEX_END) == 1
                  ):
                      raise SystemExit("README.md has mismatched download index markers")
                  updated = original[:start] + section + original[end + len(INDEX_END):]
              else:
                  intro = original.rstrip("\n") if original.strip() else "# Files"
                  updated = f"{intro}\n\n{section}\n"
              target.write_text(updated, encoding="utf-8")
              print(f"Updated README.md with {len(mods)} mods and {len(other)} other files")


          if sys.argv[1] == "size":
              print(format_size(sys.argv[2]))
          elif sys.argv[1] == "url":
              print(current_url(sys.argv[2]))
          elif sys.argv[1] == "update":
              update_old_logs()
          elif sys.argv[1] == "index":
              build_file_list()
          elif sys.argv[1] == "migrate-index":
              remove_legacy_indexes()
          elif sys.argv[1] == "batch-overrides":
              batch_overrides(int(sys.argv[2]))
          elif sys.argv[1] == "dll-fields":
              read_dll_fields(sys.argv[2])
          elif sys.argv[1] == "publish-dll":
              publish_dll(*sys.argv[2:])
          elif sys.argv[1] == "release-redirects":
              generate_release_redirects()
          else:
              raise SystemExit("Unknown metadata command")
          PY

          if [[ "$DOWNLOAD_COUNT" -gt 0 ]]; then
            python3 "$TEMP_DIR/metadata.py" batch-overrides "$DOWNLOAD_COUNT" > "$TEMP_DIR/overrides"
            mapfile -d '' -t OVERRIDES < "$TEMP_DIR/overrides"
            # Inspect PE and CLR metadata without loading the DLL or its dependencies
            mkdir -p "$TEMP_DIR/inspector"
            cat > "$TEMP_DIR/inspector/Inspector.csproj" <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <RestoreSources>$(MSBuildThisFileDirectory)</RestoreSources>
            </PropertyGroup>
          </Project>
          PROJECT
            cat > "$TEMP_DIR/inspector/Program.cs" <<'CS'
          using System.Reflection.Metadata;
          using System.Reflection.PortableExecutable;
          using System.Text.Json;

          try
          {
              using var stream = File.OpenRead(args[0]);
              using var pe = new PEReader(stream);
              if (pe.PEHeaders.PEHeader is null ||
                  (pe.PEHeaders.CoffHeader.Characteristics & Characteristics.Dll) == 0)
              {
                  throw new BadImageFormatException("The downloaded file must be a DLL");
              }

              (string? Name, string? Guid, string? Version) fields = default;
              if (pe.HasMetadata)
              {
                  var metadata = pe.GetMetadataReader();
                  var needsMetadata = new[] { "MOD_NAME", "MOD_GUID", "MOD_VERSION" }
                      .Any(key => string.IsNullOrWhiteSpace(Environment.GetEnvironmentVariable(key)));
                  if (metadata.IsAssembly && needsMetadata)
                      fields = ReadMetadata(metadata);
              }

              File.WriteAllText(args[1], JsonSerializer.Serialize(new
              {
                  name = fields.Name,
                  guid = fields.Guid,
                  version = fields.Version,
              }));
              return 0;
          }
          catch (Exception error) when (error is BadImageFormatException or IOException)
          {
              Console.Error.WriteLine($"Could not inspect the DLL: {error.Message}");
              return 1;
          }

          static (string? Name, string? Guid, string? Version) ReadMetadata(MetadataReader metadata)
          {
              var assembly = metadata.GetAssemblyDefinition();
              string? title = null, informationalVersion = null, fileVersion = null;
              string? melonName = null, melonVersion = null, melonId = null;
              string? metadataGuid = null, assemblyGuid = null;
              foreach (var handle in assembly.GetCustomAttributes())
              {
                  var attribute = metadata.GetCustomAttribute(handle);
                  switch (AttributeName(metadata, attribute))
                  {
                      case "System.Reflection.AssemblyTitleAttribute":
                          title = AttributeValue(metadata, attribute).ReadSerializedString();
                          break;
                      case "System.Reflection.AssemblyInformationalVersionAttribute":
                          informationalVersion = AttributeValue(metadata, attribute).ReadSerializedString();
                          break;
                      case "System.Reflection.AssemblyFileVersionAttribute":
                          fileVersion = AttributeValue(metadata, attribute).ReadSerializedString();
                          break;
                      case "System.Runtime.InteropServices.GuidAttribute":
                          assemblyGuid = AttributeValue(metadata, attribute).ReadSerializedString();
                          break;
                      case "System.Reflection.AssemblyMetadataAttribute":
                          var entry = AttributeValue(metadata, attribute);
                          if (string.Equals(entry.ReadSerializedString(), "GUID", StringComparison.OrdinalIgnoreCase))
                              metadataGuid = entry.ReadSerializedString();
                          break;
                      case "MelonLoader.MelonIDAttribute":
                          melonId = AttributeValue(metadata, attribute).ReadSerializedString();
                          break;
                      case "MelonLoader.MelonInfoAttribute":
                          var info = AttributeValue(metadata, attribute);
                          info.ReadSerializedString(); // Serialized System.Type of the mod class
                          melonName = info.ReadSerializedString();
                          var parameterCount = ConstructorParameterCount(metadata, attribute.Constructor);
                          if (parameterCount == 7 || parameterCount == 8)
                          {
                              melonVersion = $"{info.ReadInt32()}.{info.ReadInt32()}.{info.ReadInt32()}";
                              if (parameterCount == 8)
                                  melonVersion += info.ReadSerializedString();
                          }
                          else
                          {
                              melonVersion = info.ReadSerializedString();
                          }
                          break;
                  }
              }

              var plugins = new List<(string? Name, string? Guid, string? Version)>();
              foreach (var type in metadata.TypeDefinitions)
              {
                  foreach (var handle in metadata.GetTypeDefinition(type).GetCustomAttributes())
                  {
                      var attribute = metadata.GetCustomAttribute(handle);
                      if (AttributeName(metadata, attribute) != "BepInEx.BepInPlugin")
                          continue;
                      var plugin = AttributeValue(metadata, attribute);
                      var guid = plugin.ReadSerializedString();
                      plugins.Add((plugin.ReadSerializedString(), guid, plugin.ReadSerializedString()));
                  }
              }
              if (plugins.Count == 1)
                  return plugins[0];
              if (plugins.Count > 1)
              {
                  var guid = Environment.GetEnvironmentVariable("MOD_GUID")?.Trim();
                  var matching = plugins.Where(plugin => plugin.Guid == guid).ToArray();
                  if (matching.Length == 1)
                      return matching[0];
                  throw new IOException("Multiple BepInEx plugins found, enter the GUID of the plugin to publish");
              }

              return (
                  melonName ?? title ?? metadata.GetString(assembly.Name),
                  melonId ?? metadataGuid ?? assemblyGuid,
                  melonVersion ?? informationalVersion ?? fileVersion ?? assembly.Version.ToString()
              );
          }

          static BlobReader AttributeValue(MetadataReader metadata, CustomAttribute attribute)
          {
              var value = metadata.GetBlobReader(attribute.Value);
              if (value.ReadUInt16() != 1)
                  throw new BadImageFormatException("Invalid custom attribute metadata");
              return value;
          }

          static int ConstructorParameterCount(MetadataReader metadata, EntityHandle constructor)
          {
              var signature = constructor.Kind == HandleKind.MemberReference
                  ? metadata.GetMemberReference((MemberReferenceHandle)constructor).Signature
                  : metadata.GetMethodDefinition((MethodDefinitionHandle)constructor).Signature;
              var reader = metadata.GetBlobReader(signature);
              reader.ReadSignatureHeader();
              return reader.ReadCompressedInteger();
          }

          static string AttributeName(MetadataReader metadata, CustomAttribute attribute)
          {
              var constructor = attribute.Constructor;
              var type = constructor.Kind switch
              {
                  HandleKind.MemberReference =>
                      metadata.GetMemberReference((MemberReferenceHandle)constructor).Parent,
                  HandleKind.MethodDefinition =>
                      (EntityHandle)metadata.GetMethodDefinition((MethodDefinitionHandle)constructor).GetDeclaringType(),
                  _ => default,
              };
              if (type.Kind == HandleKind.TypeReference)
              {
                  var reference = metadata.GetTypeReference((TypeReferenceHandle)type);
                  return $"{metadata.GetString(reference.Namespace)}.{metadata.GetString(reference.Name)}";
              }
              if (type.Kind == HandleKind.TypeDefinition)
              {
                  var definition = metadata.GetTypeDefinition((TypeDefinitionHandle)type);
                  return $"{metadata.GetString(definition.Namespace)}.{metadata.GetString(definition.Name)}";
              }
              return "";
          }
          CS
            (
              cd "$TEMP_DIR/inspector"
              DOTNET_NOLOGO=1 dotnet build --output "$TEMP_DIR/inspector-bin"
            )
          fi

          prepare_download() {
            local url="$1" directory="$2"
            local -x MOD_NAME="$3" MOD_GUID="$4" MOD_VERSION="$5"
            local downloaded_path="$directory/input.dll"
            local max_size=$((100 * 1024 * 1024))
            local filename file_size size type modified crc32 md5 sha1 sha256 site_url
            local -a fields

            mkdir -p "$directory"
            curl --fail --silent --show-error --location --globoff \
              --proto '=http,https' --proto-redir '=http,https' \
              --max-filesize "$max_size" --output "$downloaded_path" -- "$url"
            file_size=$(wc -c < "$downloaded_path")
            if [ "$file_size" -gt "$max_size" ]; then
              echo "Error: File size ($((file_size / 1024 / 1024)) MB) exceeds the 100MB limit"
              exit 1
            fi

            dotnet "$TEMP_DIR/inspector-bin/Inspector.dll" \
              "$downloaded_path" "$directory/dll-metadata.json"
            python3 "$TEMP_DIR/metadata.py" dll-fields "$directory/dll-metadata.json" \
              > "$directory/dll-fields"
            mapfile -t fields < "$directory/dll-fields"
            filename="${fields[0]}"
            mv -- "$downloaded_path" "$directory/$filename"
            downloaded_path="$directory/$filename"
            echo "Validated DLL: $filename"

            type=$(file -b -- "$downloaded_path")
            size=$(python3 "$TEMP_DIR/metadata.py" size "$file_size")
            md5=$(md5sum -- "$downloaded_path" | awk '{print $1}')
            sha1=$(sha1sum -- "$downloaded_path" | awk '{print $1}')
            sha256=$(sha256sum -- "$downloaded_path" | awk '{print $1}')
            crc32=$(python3 -c "import sys, binascii; print(format(binascii.crc32(open(sys.argv[1], 'rb').read()) & 0xFFFFFFFF, '08x'))" "$downloaded_path")
            modified=$(stat -c "%y" -- "$downloaded_path")
            site_url=$(python3 "$TEMP_DIR/metadata.py" url "$filename")
            printf '%s\n' "$sha256" >> "$directory/dll-fields"
            {
              printf '\nMetadata:\n'
              printf -- '- File: %s\n' "$filename"
              printf -- '- Size: %s\n' "$size"
              printf -- '- Type: %s\n' "$type"
              printf -- '- Modified Time: %s\n' "$modified"
              printf -- '- CRC32: %s\n' "$crc32"
              printf -- '- MD5: %s\n' "$md5"
              printf -- '- SHA1: %s\n' "$sha1"
              printf -- '- SHA256: %s\n' "$sha256"
              printf -- '- Source URL: %s\n' "$url"
              printf -- '- Current URL: %s\n' "$site_url"
            } > "$directory/log-metadata"
          }

          # Validate every input before changing the repository or its releases
          DOWNLOAD_DIRS=()
          for index in "${!DOWNLOAD_URLS[@]}"; do
            directory="$TEMP_DIR/download/$index"
            DOWNLOAD_DIRS+=("$directory")
            offset=$((index * 3))
            echo "Processing DLL $((index + 1)) of $DOWNLOAD_COUNT"
            prepare_download "${DOWNLOAD_URLS[index]}" "$directory" \
              "${OVERRIDES[offset]}" "${OVERRIDES[offset + 1]}" "${OVERRIDES[offset + 2]}"
          done
          if [[ "$DOWNLOAD_COUNT" -eq 0 ]]; then
            echo "No URL provided, skipping download"
          fi

          python3 "$TEMP_DIR/metadata.py" migrate-index

          # Reuse identical files and number different files with the same name,
          # for example name(1).ext or name(2).ext
          # PLACED_NEW tells the caller whether a file was added
          place_file() {
            local source="$1" destination_dir="$2"
            local filename="${source##*/}" stem suffix="" candidate number=0
            stem="$filename"
            if [[ "$filename" == ?*.* ]]; then
              stem="${filename%.*}"
              suffix=".${filename##*.}"
            fi
            candidate="$destination_dir/$filename"

            while [[ -e "$candidate" || -L "$candidate" ]]; do
              if [[ -f "$candidate" && ! -L "$candidate" && ! -L "$source" ]] \
                && cmp -s -- "$source" "$candidate"; then
                echo "Reusing identical file: $candidate"
                rm -- "$source"
                PLACED_NEW=false
                git add -f -- "$candidate"
                return
              fi
              number=$((number + 1))
              candidate="$destination_dir/${stem}(${number})${suffix}"
            done

            echo "Moving '$source' to '$candidate'"
            mv -- "$source" "$candidate"
            PLACED_NEW=true
            git add -f -- "$candidate"
          }

          # Store commit-message text files in the workflow folder
          mkdir -p workflow

          if [[ "$MOVE_EXISTING_FILES" == true ]]; then
            # Migrate commit messages from the old location first
            if [ -d texts/workflow ]; then
              while IFS= read -r -d '' OLD_FILE; do
                place_file "$OLD_FILE" workflow
              done < <(find texts/workflow \( -type f -o -type l \) -print0)
            fi

            # Flatten subfolders while keeping Git internals, GitHub configuration,
            # and the commit-message folder in their locations
            while IFS= read -r -d '' OLD_FILE; do
              place_file "$OLD_FILE" .
            done < <(
              find . \( -path './.git' -o -path './.github' -o -path './workflow' \) -prune \
                -o \( -type f -o -type l \) -path './*/*' -print0
            )

            # Remove the emptied folders, working from children to parents
            while IFS= read -r -d '' OLD_DIR; do
              rmdir -- "$OLD_DIR" 2>/dev/null || true
            done < <(
              find . \( -path './.git' -o -path './.github' -o -path './workflow' \) -prune \
                -o -type d ! -path . -print0 | sort -zr
            )
          else
            echo "Moving existing files is disabled, keeping existing folders"
          fi

          # Stage every DLL first so local filename conflicts fail before publishing
          DOWNLOAD_ADDED=()
          for index in "${!DOWNLOAD_DIRS[@]}"; do
            directory="${DOWNLOAD_DIRS[index]}"
            mapfile -t DLL_FIELDS < "$directory/dll-fields"
            FILE="${DLL_FIELDS[0]}"
            DOWNLOADED_PATH="$directory/$FILE"
            if [[ -e "./$FILE" || -L "./$FILE" ]] \
              && { [[ ! -f "./$FILE" || -L "./$FILE" ]] || ! cmp -s -- "$DOWNLOADED_PATH" "./$FILE"; }; then
              echo "Error: $FILE already exists with different contents, use a new version"
              exit 1
            fi
            place_file "$DOWNLOADED_PATH" .
            DOWNLOAD_ADDED[index]="$PLACED_NEW"
          done
          for directory in "${DOWNLOAD_DIRS[@]}"; do
            mapfile -t DLL_FIELDS < "$directory/dll-fields"
            python3 "$TEMP_DIR/metadata.py" publish-dll \
              "./${DLL_FIELDS[0]}" "${DLL_FIELDS[1]}" "${DLL_FIELDS[2]}" "${DLL_FIELDS[3]}"
          done

          if [[ "$MOVE_EXISTING_FILES" == true ]]; then
            python3 "$TEMP_DIR/metadata.py" release-redirects
            python3 "$TEMP_DIR/metadata.py" update
          fi

          # Include file moves and deletions, even if the download was a duplicate
          git add -A
          # Refresh the list for downloads, migrations, and direct repository pushes
          python3 "$TEMP_DIR/metadata.py" index
          git add -f -- README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          write_commit_log() {
            local index="${1:-}" directory="" filename="" added=false number=1
            if [[ -n "$index" ]]; then
              directory="${DOWNLOAD_DIRS[index]}"
              added="${DOWNLOAD_ADDED[index]}"
              IFS= read -r filename < "$directory/dll-fields"
            fi

            # Use one log per DLL so older log updates can still match each checksum
            MSG_FILE="workflow/commit_msg_${TIMESTAMP}.txt"
            while [[ -e "$MSG_FILE" || -L "$MSG_FILE" ]]; do
              MSG_FILE="workflow/commit_msg_${TIMESTAMP}(${number}).txt"
              number=$((number + 1))
            done
            {
              if [[ "$added" == true ]]; then
                printf 'Add downloaded file "%s"\n' "$filename"
              else
                printf 'Update repository file list and metadata\n'
              fi
              printf '\nMove existing files to root: %s\n' "$MOVE_EXISTING_FILES"
              if [[ -n "$directory" ]]; then
                cat "$directory/log-metadata"
              else
                printf '\nNo download requested\n'
                printf -- '- Current URL: N/A (no download requested)\n'
              fi
            } > "$MSG_FILE"
            git add -f -- "$MSG_FILE"
          }

          if [[ "$DOWNLOAD_COUNT" -eq 0 ]]; then
            write_commit_log
          else
            for index in "${!DOWNLOAD_DIRS[@]}"; do
              write_commit_log "$index"
            done
          fi

          COMMIT_MESSAGE="$MSG_FILE"
          if [[ "$DOWNLOAD_COUNT" -gt 1 ]]; then
            COMMIT_MESSAGE="$TEMP_DIR/batch-commit-message"
            {
              printf 'Process %s DLL downloads\n' "$DOWNLOAD_COUNT"
              printf '\nMove existing files to root: %s\n\n' "$MOVE_EXISTING_FILES"
              for directory in "${DOWNLOAD_DIRS[@]}"; do
                IFS= read -r filename < "$directory/dll-fields"
                printf -- '- %s\n' "$filename"
              done
            } > "$COMMIT_MESSAGE"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Include this run's new commit-message files in the final listing
          python3 "$TEMP_DIR/metadata.py" index
          git add -f -- README.md
          git commit -F "$COMMIT_MESSAGE"
          git push
